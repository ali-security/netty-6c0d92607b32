language: java

# Sealed build: Travis no longer provisions oraclejdk7/openjdk7. Run on focal with
# openjdk8 as the image JDK; .travis/seal-setup.sh installs Zulu OpenJDK 7 (the
# published jar was built with JDK 1.7.0_25; the pom's enforcer requires >= 1.7)
# and Maven 3.8.8, and the whole test suite runs on JDK 7.
dist: focal
jdk:
  - openjdk8
env:
  global:
    - SEAL_JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
    - SEAL_MAVEN=3.8.8

# Sealed build: upstream's `branches: only` filter is dropped so the fork's build
# branch is built, and its install step (`mvn -DskipTests clean install`) is folded
# into the test run below.
before_install: source .travis/seal-setup.sh
install: true

script:
  - mvn -B -V -e clean test -Dcheckstyle.skip=true -Danimal.sniffer.skip=true
  - python3 .travis/surefire-summary.py

# Sealed build: keep the job open until Travis has archived the test summary.
after_script: bash .travis/wait-for-log.sh
