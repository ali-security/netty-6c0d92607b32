name: seal-build

# Sealed build: package the jar. The test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Temurin 8 only donates its cacerts; seal-setup.sh installs Zulu 7 (the
      # published jar was built with JDK 1.7.0_25) and Maven 3.8.8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      # -DbuildNumber: the antrun write-version step bakes `git log -1 --format=%h`
      # into org.jboss.netty.util.Version; pin it to the 3.7.0.Final release commit
      # so Version.ID matches the published jar ("3.7.0.Final-5b2cb54").
      - name: Package (tests run on Travis)
        run: |
          source .travis/seal-setup.sh
          mvn -B -V -e clean package -DskipTests -DbuildNumber=5b2cb54 -Dcheckstyle.skip=true -Danimal.sniffer.skip=true -Dmaven.javadoc.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: netty-jar
          path: target/netty-3.7.0.Final.jar
          if-no-files-found: error
